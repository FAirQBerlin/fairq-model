[tool.poetry]
name = "fairqmodel"
version = "2026.06.0"
description = "This repo contains the Python code of the entire life cycle of the air quality model"
authors = ["Henrik Tillkorn <henrik.tillkorn@inwt-statistics.de>, Milan Flach <milan.flach@inwt-statistics.de>"]
readme = "README.md"
packages = [{ include = "fairqmodel" }]


[tool.bumpver]
current_version = "2026.06.0"
version_pattern = "YYYY.0M.PATCH"
commit_message = "bump version to {old_version} -> {new_version}"
tag_message = "v{new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{version}"',
    '^current_version = "{version}"',
]
"fairqmodel/__init__.py" = [
    '^__version__ = "{version}"',
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pandas = "^3.0.2"
xgboost = "^3.2.0"
scikit-learn = "^1.7.2"
tqdm = "^4.67.3"
python-dateutil = "^2.9.0.post0"
pytz-deprecation-shim = "^0.1.0.post0"
tzdata = "^2026.1"
tzlocal = "^5.3.1"
sqlalchemy = "^2.0.49"
numpy = "^2.4.4"
python-dotenv = "^1.2.1"
clickhouse-connect = "^1.0.0"
loguru = "^0.7.3"
tenacity = "^9.0.0"
pytz = "^2026.2"

[tool.poetry.group.dev.dependencies]
bumpver = "*"
ruff = "*"
mypy = "*"
pytest = "^9.0.3"
optuna = "^4.8.0"


[tool.pytest.ini_options]
markers = [
    "tests_on_real_clickhouse: marks tests that require a real ClickHouse instance",
]
addopts = "-m 'not tests_on_real_clickhouse'"
testpaths = ["fairqmodel/tests"]
filterwarnings = [
    # upstream bug in clickhouse-connect 1.0.0 (ctypes 'u' type code raised via frozen importlib)
    "ignore:The 'u' type code is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "notebooks/",
    ".venv/"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",    # type annotations
    "COM812", # trailing comma
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "EM",     # exception message style
    "TRY003", # exception message length
    "TRY002", # custom exception class
    "FBT",    # boolean arg style
    "PLR0913",# too many arguments
    "TC001",  # type-checking import (own package)
    "TC002",  # type-checking import third-party
    "TC003",  # type-checking import stdlib
    "PD002",  # inplace=True
    "S307",   # eval() usage
    "S108",   # /tmp usage
    "S101",   # assert usage
    "S608",   # SQL injection via string
    "TD",     # TODO style
    "FIX002", # fixme
    "C416",   # list comprehension
]

[tool.ruff.lint.per-file-ignores]
"fairqmodel/tests/test_*.py" = ["S101"]
"fairqmodel/deprecated/*" = ["ALL"]
"fairqmodel/deprecated/**/*" = ["ALL"]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true

[tool.mypy]
ignore_missing_imports = true
exclude = "fairqmodel/deprecated/"
